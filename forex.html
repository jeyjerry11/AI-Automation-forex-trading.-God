<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invest Smart | Forex Trading</title>
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #12141d;
            --accent: #00d4ff;
            --text-light: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-light);
            /* Soft background for the whole page */
            background: radial-gradient(circle at center, #1a1c23 0%, #0b0c10 100%);
        }

        /* The Frame with Background Image */
        .promo-card {
            width: 100%;
            max-width: 450px;
            position: relative;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* The Image Layer */
        .card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* High-end Trading/Chart Imagery */
            background-image: url('https://images.unsplash.com/photo-1611974717482-98ea0524d579?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        /* Dark Overlay to make text pop */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(18, 20, 29, 0.85) 0%, rgba(18, 20, 29, 0.98) 100%);
            z-index: -1;
        }

        .badge {
            background: rgba(0, 255, 136, 0.15);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 24px;
            display: inline-block;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            line-height: 1.1;
            font-weight: 800;
            background: linear-gradient(to bottom, #ffffff 0%, #a1a1a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            color: #cbd5e1;
            font-size: 1rem;
            margin-bottom: 30px;
            line-height: 1.5;
            font-weight: 300;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 35px;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 5px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature-item span {
            display: block;
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .feature-item p {
            font-size: 0.6rem;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .pricing {
            font-size: 1.2rem;
            font-weight: 400;
            color: #fff;
            margin-bottom: 35px;
        }

        .pricing strong {
            color: var(--primary);
            font-weight: 800;
        }

        .cta-button {
            display: block;
            background: var(--primary);
            color: #050505;
            text-decoration: none;
            padding: 20px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cta-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 255, 136, 0.6);
            filter: brightness(1.1);
        }

        .footer-note {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #94a3b8;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="promo-card">
        <div class="card-bg"></div>
        <div class="overlay"></div>

        <div class="badge">Professional Guidance</div>
        <h1>Turn Capital Into Opportunity</h1>
        
        <p class="description">
            Trade Forex with a structured strategy. Start small, grow smart—built for thinkers.
        </p>

        <div class="features">
            <div class="feature-item">
                <span>📈</span>
                <p>Returns</p>
            </div>
            <div class="feature-item">
                <span>🔒</span>
                <p>Transparent</p>
            </div>
            <div class="feature-item">
                <span>⚡</span>
                <p>Fast</p>
            </div>
        </div>

        <p class="pricing">Account Tiers: <strong>$500 – $5,000</strong></p>

        <a href="https://jeyjerry11.github.io/Investmentcompany.com/" class="cta-button">
            Get Started Now
        </a>

        <p class="footer-note">Smarter than betting. Start your journey.</p>
    </div>

</html>
